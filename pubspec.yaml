name: app_locker
description: Eine Flutter App zum Sperren von Apps mit Fingerabdruck-Authentifizierung
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  local_auth: ^2.1.7
  local_auth_android: ^1.0.34
  shared_preferences: ^2.2.2
  installed_apps: ^1.8.0
  permission_handler: ^11.0.1
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
